name: CipherCraft Android

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'static/**', 'src/**', 'tools/runtime/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Sign an internal-test bundle with the configured upload key'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            tools/runtime/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and verify shared engine
        run: |
          python -m pip install -e '.[dev,web-test]'
          python -m pytest tests/ -q
          python -m flake8 src tests scripts --select=E9,F63,F7,F82 --show-source
          npm ci --prefix tools/runtime --no-audit --no-fund
          npm ci --prefix mobile --no-audit --no-fund
          python scripts/build_static.py
      - name: Restore optional Firebase client configuration
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > mobile/android/app/google-services.json
            echo 'Firebase client configuration supplied.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Push is not configured in this build; no server credential is included.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sync bundled assets and install SDK
        run: |
          cd mobile
          npx --no-install cap sync android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Lint, native unit checks, APK and bundle builds
        working-directory: mobile/android
        env:
          CIPHER_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bash gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --no-daemon
      - name: Verify packaged offline runtime and deletion UI
        run: python scripts/check_android_apk.py mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed Android WebView, ciphers and bundled AI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python scripts/check_android_emulator.py
      - name: Prepare test download and checksums
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/CipherCraft-android-test.apk
          cd dist
          sha256sum CipherCraft-android-test.apk > CipherCraft-android-test.apk.sha256
          echo 'Debug APK is for testing. Release bundle is unsigned and is not ready for Play upload.' >> "$GITHUB_STEP_SUMMARY"
      - name: Sign requested Play internal-test bundle
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$ANDROID_UPLOAD_PASSWORD"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ciphercraft-upload.keystore"
          trap 'rm -f "$RUNNER_TEMP/ciphercraft-upload.keystore"' EXIT
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab dist/CipherCraft-play-internal.aab
          jarsigner -keystore "$RUNNER_TEMP/ciphercraft-upload.keystore" -storepass:env ANDROID_UPLOAD_PASSWORD -keypass:env ANDROID_UPLOAD_PASSWORD -digestalg SHA-256 -sigalg SHA256withRSA dist/CipherCraft-play-internal.aab ciphercraft-upload
          jarsigner -verify dist/CipherCraft-play-internal.aab
          cd dist
          sha256sum CipherCraft-play-internal.aab > CipherCraft-play-internal.aab.sha256
          echo 'Signed internal-test AAB is available; no automatic Play rollout is performed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks-${{ github.sha }}
          retention-days: 14
          path: |
            dist/CipherCraft-android-test.apk*
            dist/CipherCraft-play-internal.aab*
            dist/android-checks/
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
