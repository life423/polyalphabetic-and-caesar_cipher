name: CipherCraft CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies and app
        run: |
          python -m pip install -e .
          python -m pip install pytest flake8 pyyaml
      - name: Critical lint checks
        run: python -m flake8 src tests run.py gui.py --select=E9,F63,F7,F82 --show-source --statistics
      - name: All tests
        run: python -m pytest tests/ -q

  gui-smoke:
    name: Verify real Tk window under virtual display
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install display server and application
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install -e .
      - name: Test actual Tk controls, resizing and startup
        run: xvfb-run -a python tests/smoke_tk_gui.py

  build:
    name: Build ${{ matrix.os }}
    needs: [test, gui-smoke]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ciphercraft-windows
            archive: ciphercraft-windows.zip
          - os: macos-latest
            artifact: ciphercraft-macos
            archive: ciphercraft-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder
        run: |
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build CLI
        run: python -m PyInstaller --clean --noconfirm --onefile --name cipher_tool src/ui/cli.py
      - name: Build GUI
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name cipher_gui gui.py
      - name: Smoke-test packaged CLI
        run: python tests/smoke_executable.py
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/cipher_tool.exe,dist/cipher_gui.exe -DestinationPath ${{ matrix.archive }}
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.archive }} cipher_tool cipher_gui.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish stable versioned downloads
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged macOS and Windows archives
        uses: actions/download-artifact@v4
        with:
          pattern: ciphercraft-*
          merge-multiple: true
      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import pathlib,re; print(re.search(r"version=\"([^\"]+)\"", pathlib.Path("setup.py").read_text()).group(1))')
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish release once per version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing published artifacts."
            exit 0
          fi
          gh release create "$TAG" ciphercraft-macos.zip ciphercraft-windows.zip \\
            --target "$GITHUB_SHA" --title "CipherCraft $TAG" \\
            --notes-file RELEASE_NOTES.md --latest
