name: CipherCraft CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies and app
        run: |
          python -m pip install -e .
          python -m pip install pytest flake8 pyyaml
      - name: Critical lint checks
        run: python -m flake8 src tests run.py gui.py --select=E9,F63,F7,F82 --show-source --statistics
      - name: All tests
        run: python -m pytest tests/ -q

  build:
    name: Build ${{ matrix.os }}
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ciphercraft-windows
            archive: ciphercraft-windows.zip
          - os: macos-latest
            artifact: ciphercraft-macos
            archive: ciphercraft-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder
        run: |
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build CLI
        run: python -m PyInstaller --clean --noconfirm --onefile --name cipher_tool src/ui/cli.py
      - name: Build GUI
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name cipher_gui gui.py
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/cipher_tool.exe,dist/cipher_gui.exe -DestinationPath ${{ matrix.archive }}
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.archive }} cipher_tool cipher_gui.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: ciphercraft-*
          merge-multiple: true
      - name: Upload to published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ciphercraft-*.zip --clobber
