name: CipherCraft Custom Domain

on:
  push:
    branches: [main]
    paths: ['static/**', 'src/**', 'tools/runtime/**', 'scripts/build_static.py', 'tests/smoke_static_browser.py', 'tests/smoke_play_browser.py', 'tests/smoke_hash_browser.py', 'tests/smoke_learn_browser.py', 'tests/smoke_caesar_lesson_browser.py', 'tests/smoke_navigation_browser.py', 'tests/smoke_password_browser.py', 'tests/smoke_messages_browser.py', 'tests/smoke_messenger_browser.py', 'tests/smoke_messenger_crypto.py', 'tests/smoke_push_browser.py', 'tests/smoke_admin_browser.py', 'tests/smoke_account_deletion_browser.py', 'tests/smoke_legal_browser.py', 'tests/test_mission.py', 'tests/test_lessons.py', '.gitattributes', '.github/workflows/static-app.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciphercraft-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/runtime/package-lock.json
      - name: Install and build
        run: |
          npm ci --prefix tools/runtime --no-audit --no-fund
          python -m pip install -e ".[dev,web-test]"
          python -m playwright install --with-deps chromium
          python scripts/build_static.py
      - name: Verify shared engine and browser workflows
        run: |
          python -m pytest tests/ -q
          python -m http.server 8502 --directory dist/static > /tmp/static.log 2>&1 &
          python tests/smoke_static_browser.py
          python tests/smoke_play_browser.py
          python tests/smoke_hash_browser.py
          python tests/smoke_learn_browser.py
          python -m tests.smoke_caesar_lesson_browser
          python tests/smoke_navigation_browser.py
          python tests/smoke_password_browser.py
          python tests/smoke_messages_browser.py
          python tests/smoke_messenger_crypto.py
          python tests/smoke_push_browser.py
          python -u scripts/run_messenger.py > /tmp/messenger.log 2>&1 &
          python tests/smoke_messenger_browser.py
          CIPHER_MESSENGER_ADMIN_IDS=1 CIPHER_MESSENGER_DB=/tmp/cipher-admin-test.sqlite python -u scripts/run_messenger.py --port 8504 > /tmp/admin-api.log 2>&1 &
          python -m tests.smoke_admin_browser
          CIPHER_MESSENGER_ADMIN_IDS=1 CIPHER_MESSENGER_DB=/tmp/cipher-account-deletion.sqlite python -u scripts/run_messenger.py --port 8505 > /tmp/account-deletion-api.log 2>&1 &
          python -m tests.smoke_account_deletion_browser
          python -m tests.smoke_legal_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-browser-checks
          path: |
            dist/static-checks/
            dist/play-checks/
            dist/hash-checks/
            dist/learn-checks/
            dist/caesar-lesson-checks/
            dist/nav-checks/
            dist/password-checks/
            dist/message-checks/
            dist/messenger-checks/
            dist/push-checks/
            dist/admin-checks/
            dist/account-deletion-checks/
            dist/legal-checks/
      - name: Deploy free Azure Static Web App
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/static
          output_location: ''
          skip_app_build: true
          skip_api_build: true
